{{ define "main" }}
  {{ with .Params.heroImage }}
    {{ $heroPos := $.Params.heroPosition | default "center" }}
    <section class="hero hero-image donate-hero fade-in">
      <img class="hero-bg" src="{{ . }}" alt="{{ $.Params.heroAlt | default $.Title }}" style="object-position: {{ $heroPos }};">
      <div class="container hero-content donate-hero-content">
        <h1>{{ $.Title }}</h1>
        {{ with $.Description }}<p>{{ . }}</p>{{ end }}
      </div>
    </section>
  {{ end }}

  {{ if not .Params.heroImage }}
    <section class="container page-header">
      <h1>{{ .Title }}</h1>
    </section>
  {{ end }}

  <section class="container section donate-section">
    {{ .Content }}
  </section>
{{ end }}
